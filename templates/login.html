<!DOCTYPE html>
<html>

<head>

    <title>Login - AI Skill Gap Analyzer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #312e81;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .register {
            text-align: center;
            margin-top: 25px;
        }

        .register a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #64748b;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <h1>🔐 Login</h1>

        <p class="subtitle">
            AI Skill Gap Analyzer
        </p>

        <form action="/login" method="POST">

            <label>
                📧 Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                🔑 Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

        <div class="home">

            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
